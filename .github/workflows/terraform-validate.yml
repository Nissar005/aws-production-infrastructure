# These checks validate Terraform but do not create or modify AWS resources.
name: Terraform Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Format and Validate
    runs-on: ubuntu-latest
    steps:
      # Download the repository contents.
      - name: Check out source
        uses: actions/checkout@v4

      # Install the Terraform CLI.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      # Fail if Terraform files are not formatted consistently.
      - name: Check formatting
        run: terraform fmt -check -recursive

      # Initialize provider dependencies without a remote state backend.
      - name: Initialize Terraform
        run: terraform init -backend=false

      # Validate syntax and configuration consistency.
      - name: Validate configuration
        run: terraform validate
